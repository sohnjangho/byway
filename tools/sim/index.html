<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>에움길 주행 시뮬레이터</title>
<!-- 브라우저에서 바로 도는 3D 주행 시뮬레이터. 시안과 연출이며 실제 차량 소프트웨어가 아니다.
     실행: 저장소 루트에서 python3 -m http.server 후 /tools/sim/ 을 연다. three.js 는 vendor/ 에 들어 있어 인터넷 없이 돈다. -->
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }</script>
<link rel="stylesheet" href="../../design/screens/tokens.css">
<link rel="stylesheet" href="../../design/screens/app.css">
<link rel="stylesheet" href="sim.css">
</head>
<body>
<div id="css"></div>
<canvas id="gl"></canvas>
<div class="hud">
  <div class="hud-title">에움길 주행 시뮬레이터 <span>시안 · 연출</span></div>
  <div class="hud-keys"><b>↑/W</b> 가속 · <b>↓/S</b> 감속·후진 · <b>D/P</b> 기어 · <b>마우스 끌기</b> 둘러보기 · <b>1 2 3 4</b> 앞·왼쪽·오른쪽·뒤 · <b>화면 클릭</b> 에움길 조작 · <b>Esc</b> 돌아가기</div>
  <div class="hud-state"><span id="hudZone"></span><span id="hudSpeed"></span></div>
  <div class="hud-jump"><button data-jump="park">주차장</button><button data-jump="forest">숲길</button><button data-jump="city">도심</button><button data-jump="river">강변</button></div>
</div>
<div class="loading" id="loading">불러오는 중…</div>
<script type="module" src="sim.js"></script>
</body>
</html>
