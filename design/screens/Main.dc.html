<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>에움길 둘러보기</title>
<script src="./support.js"></script>
<script src="courses.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@400;500;600;700&family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
</helmet>
<div class="stage" data-theme="night">
<div class="screen screen-rail">
  <nav class="rail">
    <a href="Main.dc.html" class="brand t-brand">에움길</a>
    <a href="Main.dc.html" class="rail-item t-small is-on">둘러보기</a>
    <a href="Ranking.dc.html" class="rail-item t-small">랭킹</a>
    <a href="Me.dc.html" class="rail-item t-small">내 코스</a>
    <a href="Me.dc.html" class="rail-me" aria-label="내 정보"><span class="avatar t-small">나</span></a>
  </nav>
  <div class="browse">
    <div class="browse-top">
      <a href="Preview.dc.html" class="tile-photo">
        <img src="{{ hero.picture }}" alt="">
        <div class="photo-band">
          <span class="t-small">오늘 저녁 달리기 좋은 길</span>
          <h1 class="t-title">{{ hero.name }}</h1>
          <div class="picks">
            <sc-for list="{{ hero.tags }}" as="tag" hint-placeholder-count="3"><span class="pick t-label">{{ tag.text }}</span></sc-for>
          </div>
        </div>
      </a>
      <sc-for list="{{ shelves }}" as="s" hint-placeholder-count="2">
        <button type="button" onClick="{{ s.pick }}" class="tile-photo">
          <img src="{{ s.picture }}" alt="">
          <span class="photo-band"><span class="t-heading">{{ s.label }}</span><span class="t-small">코스 {{ s.count }}개</span></span>
        </button>
      </sc-for>
    </div>
    <div class="chips">
      <sc-for list="{{ regions }}" as="r" hint-placeholder-count="8">
        <button type="button" onClick="{{ r.pick }}" class="{{ r.cls }}">{{ r.label }} <span class="chip-count">{{ r.count }}</span></button>
      </sc-for>
    </div>
    <div class="browse-grid">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="10">
        <a href="Preview.dc.html" class="photo-card">
          <img src="{{ c.picture }}" alt="">
          <span class="t-body bold">{{ c.name }}</span>
          <span class="t-label ink-2">{{ c.note }}</span>
        </a>
      </sc-for>
    </div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1700,"height":1184}}'>
const COVER = "coverNight";
const picture = (c) => c.photo || c[COVER];
const byId = (id) => window.COURSES.find((c) => c.id === id);
const REGIONS = ['수도권', '강원', '충청', '경상', '전라', '남해안', '제주'];
const SHELVES = [
  { label: '바다를 끼고', theme: 'coast', cover: 'dalmaji-coast' },
  { label: '고개를 넘어', theme: 'mountain', cover: 'cheongpung-lake' },
];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { region: '전체', theme: null }; }
  renderVals() {
    const { region, theme } = this.state;
    const all = window.COURSES;
    const shown = all.filter((c) => (theme ? c.themes.includes(theme) : region === '전체' || c.region === region));
    const hero = byId('paldang-sunset');
    const chip = (label, count) => ({
      label, count,
      cls: !theme && region === label ? 'chip t-small is-on' : 'chip t-small',
      pick: () => this.setState({ region: label, theme: null }),
    });
    return {
      hero: { name: hero.name, picture: picture(hero), tags: hero.picks.map((text) => ({ text })) },
      shelves: SHELVES.map((s) => ({
        label: s.label, picture: picture(byId(s.cover)),
        count: all.filter((c) => c.themes.includes(s.theme)).length,
        pick: () => this.setState({ theme: s.theme }),
      })),
      regions: [chip('전체', all.length), ...REGIONS.map((r) => chip(r, all.filter((c) => c.region === r).length))],
      cards: shown.map((c) => ({ name: c.name, picture: picture(c), note: c.picks[0] + ' · ' + c.picks[1] })),
    };
  }
}
</script>
</body>
</html>
