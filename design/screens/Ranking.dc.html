<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>에움길 랭킹</title>
<script src="./support.js"></script>
<script src="courses.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@400;500;600;700&family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
</helmet>
<div class="stage" data-theme="night">
<div class="screen screen-rail">
  <nav class="rail">
    <a href="Main.dc.html" class="brand t-brand">에움길</a>
    <a href="Main.dc.html" class="rail-item t-small">둘러보기</a>
    <a href="Ranking.dc.html" class="rail-item t-small is-on">랭킹</a>
    <a href="Me.dc.html" class="rail-item t-small">내 코스</a>
    <a href="Me.dc.html" class="rail-me" aria-label="내 정보"><span class="avatar t-small">나</span></a>
  </nav>
  <div class="ranked">
    <div class="ranked-list">
      <div class="ranking-tabs">
        <sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="4">
          <button type="button" onClick="{{ tab.pick }}" class="{{ tab.cls }}">{{ tab.label }}</button>
        </sc-for>
      </div>
      <div class="ranked-rows">
        <sc-for list="{{ rows }}" as="row" hint-placeholder-count="6">
          <button type="button" onClick="{{ row.pick }}" class="{{ row.cls }}">
            <span class="ranked-no t-heading num">{{ row.rank }}</span>
            <img class="thumb" src="{{ row.picture }}" alt="">
            <span class="ranked-name"><span class="t-body bold">{{ row.name }}</span><span class="t-label ink-2">{{ row.note }}</span></span>
            <span class="t-heading num nowrap">{{ row.value }}</span>
          </button>
        </sc-for>
      </div>
      <p class="t-label ink-2">추천 표시는 에움길이 고른 것입니다</p>
    </div>
    <div class="ranked-view">
      <img class="ranked-photo" src="{{ view.picture }}" alt="">
      <div class="ranked-info soft">
        <img class="soft-img" src="{{ view.soft }}" alt="">
        <h1 class="t-title">{{ view.name }}</h1>
        <div class="picks">
          <sc-for list="{{ view.tags }}" as="tag" hint-placeholder-count="3"><span class="pick t-label">{{ tag.text }}</span></sc-for>
        </div>
        <p class="t-body ink-2">{{ view.summary }}</p>
        <a href="Preview.dc.html" class="btn-quiet t-body">코스 자세히 보기</a>
      </div>
    </div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1700,"height":1184}}'>
const COVER = "coverNight";
const picture = (c) => c.photo || c[COVER];
const KINDS = [
  { id: 'curves', label: '굽이', show: (c) => c.curves + '개' },
  { id: 'eum', label: '에움 배율', show: (c) => c.eum.toFixed(1) + '배' },
  { id: 'gain', label: '오르막', show: (c) => c.gain + 'm' },
  { id: 'km', label: '거리', show: (c) => c.km.toFixed(1) + 'km' },
];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { kind: 'curves', chosen: null }; }
  renderVals() {
    const kind = KINDS.find((k) => k.id === this.state.kind);
    const sorted = [...window.COURSES].sort((a, b) => b[kind.id] - a[kind.id]);
    const view = sorted.find((c) => c.id === this.state.chosen) || sorted[0];
    return {
      tabs: KINDS.map((k) => ({ label: k.label, cls: k.id === kind.id ? 'tab t-small is-on' : 'tab t-small', pick: () => this.setState({ kind: k.id, chosen: null }) })),
      rows: sorted.map((c, i) => ({
        rank: i + 1, name: c.name, picture: picture(c), value: kind.show(c),
        note: c.picks[0] + ' · ' + c.picks[1],
        cls: c.id === view.id ? 'ranked-row is-on' : 'ranked-row',
        pick: () => this.setState({ chosen: c.id }),
      })),
      view: { name: view.name, picture: picture(view), soft: view.soft, summary: view.summary, tags: view.picks.map((text) => ({ text })) },
    };
  }
}
</script>
</body>
</html>
