<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>에움길 코스 상세</title>
<script src="./support.js"></script>
<script src="courses.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@400;500;600;700&family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
</helmet>
<div class="stage" data-theme="day">
<div class="screen screen-rail">
  <nav class="rail">
    <a href="MainDay.dc.html" class="brand t-brand">에움길</a>
    <a href="MainDay.dc.html" class="rail-item t-small is-on">둘러보기</a>
    <a href="RankingDay.dc.html" class="rail-item t-small">랭킹</a>
    <a href="MeDay.dc.html" class="rail-item t-small">내 코스</a>
    <a href="MeDay.dc.html" class="rail-me" aria-label="내 정보"><span class="avatar t-small">나</span></a>
  </nav>
  <div class="detail">
  <div class="detail-pane">
    <div class="detail-head">
      <a href="MainDay.dc.html" class="btn-small t-small">← 뒤로</a>
      <a href="MeDay.dc.html" class="btn-small t-small">이 코스 저장</a>
    </div>
    <div class="detail-photo">
      <img src="{{ photo }}" alt="코스 풍경">
      <p class="map-credit">{{ credit }}</p>
    </div>
    <div class="detail-info soft">
      <img class="soft-img" src="{{ soft }}" alt="">
      <h1 class="t-title">{{ name }}</h1>
      <div class="picks">
        <sc-for list="{{ tags }}" as="tag" hint-placeholder-count="3"><span class="pick t-label">{{ tag.text }}</span></sc-for>
      </div>
      <p class="t-body ink-2">{{ summary }}</p>
    </div>
    <dl class="facts">
      <sc-for list="{{ facts }}" as="f" hint-placeholder-count="4">
        <div class="fact"><dd class="t-value num">{{ f.value }}<span class="t-label ink-2"> {{ f.unit }}</span></dd><dt class="t-label ink-2">{{ f.label }}</dt></div>
      </sc-for>
    </dl>

          </svg>
        </div>
    <a href="DriveDay.dc.html" class="btn-primary t-heading">내비에 코스 입히기</a>
  </div>
  <div class="map">
    <div class="{{ canvasClass }}">
      <sc-if value="{{ satellite }}" hint-placeholder-val="{{ true }}">
        <img class="map-img" src="images/sat_paldang_base.jpg" alt="팔당 노을 코스 위성 지도">
      </sc-if>
      <svg class="map-svg" viewBox="0 0 1100 1352" preserveAspectRatio="xMidYMid slice" role="img" aria-label="팔당 노을 코스 선">
        <sc-for list="{{ notes }}" as="n"><line class="map-leader" x1="{{ n.ax }}" y1="{{ n.ay }}" x2="{{ n.bx }}" y2="{{ n.by }}"/></sc-for>
        <sc-for list="{{ sections }}" as="s"><path class="route route-glow sec-{{ s.mood }}" d="{{ s.d }}"/></sc-for>
        <sc-for list="{{ sections }}" as="s"><path class="route route-case" d="{{ s.d }}"/></sc-for>
        <sc-for list="{{ sections }}" as="s"><path class="route route-line sec-{{ s.mood }}" d="{{ s.d }}"/></sc-for>
        <sc-for list="{{ stops }}" as="p"><circle class="route-stop" cx="{{ p.x }}" cy="{{ p.y }}" r="6"/></sc-for>
        <sc-for list="{{ spots }}" as="p"><circle class="route-spot" cx="{{ p.x }}" cy="{{ p.y }}" r="9"/></sc-for>
      </svg>
      <sc-for list="{{ notes }}" as="n"><span class="map-note t-label" style="left: {{ n.left }}%; top: {{ n.top }}%">{{ n.text }}</span></sc-for>
      <sc-if value="{{ satellite }}" hint-placeholder-val="{{ true }}">
        <p class="map-credit">Sentinel-2 cloudless by EOX IT Services GmbH (Contains modified Copernicus Sentinel data 2016) · 코스 선 © OpenStreetMap contributors</p>
      </sc-if>
      <div class="seg-toggle">
        <button type="button" onClick="{{ pickSatellite }}" class="{{ satelliteClass }}">위성</button>
        <button type="button" onClick="{{ pickDrawing }}" class="{{ drawingClass }}">코스 그림</button>
      </div>
    </div>
  </div>
  </div>
</div>
</div>
</x-dc>
