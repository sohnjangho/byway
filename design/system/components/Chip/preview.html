<!-- @dsCard group="정보" height=340 width=1400 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  body { margin: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .stage { min-height: 0; display: flex; flex-direction: column; gap: var(--space-6); padding: var(--space-8); }
  .chips { flex-wrap: wrap; }
</style>
<template id="sample">
  <div class="chips">
    <span class="chip is-on t-small">전체 <span class="chip-count">15</span></span>
    <span class="chip t-small">수도권 <span class="chip-count">5</span></span>
    <span class="chip t-small">제주 <span class="chip-count">2</span></span>
  </div>
  <div class="chips">
    <span class="chip t-small"><i class="dot sec-forest"></i>숲길</span>
    <span class="chip t-small"><i class="dot sec-city"></i>도심</span>
    <span class="chip t-small"><i class="dot sec-river"></i>강변</span>
  </div>
</template>
<section class="stage" data-theme="night"></section>
<section class="stage" data-theme="day"></section>
<script>
  document.querySelectorAll('.stage').forEach((stage) => stage.append(document.getElementById('sample').content.cloneNode(true)));
</script>
