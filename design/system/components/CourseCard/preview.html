<!-- @dsCard group="정보" height=560 width=1400 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  body { margin: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .stage { min-height: 0; display: flex; flex-direction: column; gap: var(--space-6); padding: var(--space-8); }
  .course-card { width: 340px; }
</style>
<template id="sample">
  <a class="course-card">
    <img src="{cover}" alt="">
    <span class="info-box soft">
      <img class="soft-img" src="/_blob/eade09a0431e36b70c8eb5fb6b88e95e" alt="">
      <span class="t-body bold">팔당 노을</span>
      <span class="t-label ink-2">가을에 추천</span>
    </span>
  </a>
</template>
<section class="stage" data-theme="night"></section>
<section class="stage" data-theme="day"></section>
<script>
  const sample = document.getElementById('sample').innerHTML;
  const covers = { night: '/_blob/6ec5d5b5740c96fc2bc0e2c06d5ef7e4', day: '/_blob/ea1904aba5be175d7f005bfd7f3b04d3' };
  document.querySelectorAll('.stage').forEach((stage) => {
    stage.innerHTML = sample.replace('{cover}', covers[stage.dataset.theme]);
  });
</script>
